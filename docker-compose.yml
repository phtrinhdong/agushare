# =========================================================
# agushare — 生产部署
#   - web:        FastAPI Web 看板 (端口 8000)
#   - scheduler:  APScheduler 常驻进程,交易日 15:35 自动扫描
# =========================================================
#
# 首次启动:
#   cp .env.example .env  &&  vi .env       # 填用户名密码 (可选)
#   docker compose up -d --build
#
# 升级代码:
#   git pull && docker compose up -d --build
#
# 查看日志:
#   docker compose logs -f web
#   docker compose logs -f scheduler
# =========================================================

services:
  web:
    build: .
    image: agushare:latest
    container_name: agushare-web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      TZ: Asia/Shanghai
      # 可选: 开启 HTTP Basic Auth (在 .env 里设置)
      AGU_AUTH_USER: "${AGU_AUTH_USER:-}"
      AGU_AUTH_PASS: "${AGU_AUTH_PASS:-}"
    volumes:
      # 配置文件 (改完不用 rebuild,重启容器即可)
      - ./ashare_agent/config.yaml:/app/ashare_agent/config.yaml:ro
      # 数据持久化 - 路径必须匹配代码写入的实际位置 /app/ashare_agent/...
      - ./data/cache:/app/ashare_agent/cache               # akshare K线 parquet
      - ./data/output:/app/ashare_agent/output             # 扫描报告/K线图/回测观察
      - ./data/logs:/app/ashare_agent/logs                 # agent.log
      - ./data/agent_data:/app/ashare_agent/data           # 历史数据库 + watchlist.json
      # 用户自定义形态目录 (热挂载, 改完重启容器生效)
      - ./ashare_agent/patterns/custom:/app/ashare_agent/patterns/custom:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    build: .
    image: agushare:latest
    container_name: agushare-scheduler
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./ashare_agent/config.yaml:/app/ashare_agent/config.yaml:ro
      - ./data/cache:/app/ashare_agent/cache
      - ./data/output:/app/ashare_agent/output
      - ./data/logs:/app/ashare_agent/logs
      - ./data/agent_data:/app/ashare_agent/data
      - ./ashare_agent/patterns/custom:/app/ashare_agent/patterns/custom:ro
    command:
      - python
      - -m
      - ashare_agent.main
      - schedule
    # scheduler 不跑 web 服务,关闭从镜像继承的 healthcheck (避免 unhealthy 误报)
    healthcheck:
      disable: true
    depends_on:
      - web

# 数据卷说明 (宿主机路径 → 容器内路径):
#   data/cache         /app/ashare_agent/cache              akshare 拉到的日K parquet
#   data/output        /app/ashare_agent/output             reports/charts/observations
#     ├── reports/      每日 Excel + JSON 快照 + 回测 HTML 报告
#     ├── charts/       K线图 PNG
#     └── observations/ K型回测观察结果 JSON
#   data/logs          /app/ashare_agent/logs               agent.log
#   data/agent_data    /app/ashare_agent/data               历史数据库 + 关注列表
#     ├── history/      深度 K线缓存 (回测观察用)
#     └── watchlist.json 特别关注列表

# 重要: 所有这些数据在 docker compose down / up / build / restart 后都会保留
